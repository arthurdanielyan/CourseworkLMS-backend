lms:
  jwt:
    secret: test-secret-that-is-at-least-thirty-two-bytes-long
  mail:
    from: no-reply@lms.test
  notifications:
    # Tests run the job themselves, at any time of day.
    check-interval: PT1H
    reminder-hour: 0

spring:
  flyway:
    # afterMigrate.sql adds the two students the tests act as.
    locations: classpath:db/migration,classpath:db/testdata
  # Never contacted: tests record emails instead of sending them.
  mail:
    host: localhost
  datasource:
    hikari:
      # One connection, so consecutive transactions are guaranteed to reuse it.
      maximum-pool-size: 1
