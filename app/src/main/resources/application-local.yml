# Running on a developer machine against the local PostgreSQL. Passwords still come from the environment.
lms:
  jwt:
    # Local development only; any other environment must set JWT_SECRET.
    secret: ${JWT_SECRET:local-development-secret-not-for-production-use}
  exposed:
    show-sql: true
  mail:
    from: ${MAIL_FROM:no-reply@lms.local}

# Mailpit from compose.yaml: every email lands in its web inbox at http://localhost:8025 instead of being delivered.
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
