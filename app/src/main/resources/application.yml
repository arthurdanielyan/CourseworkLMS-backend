spring:
  application:
    name: lms
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/LMS}
    # The application role cannot disable triggers; only Flyway connects as the schema owner.
    username: ${DB_USER:lms_app}
    password: ${DB_PASSWORD}
  flyway:
    user: ${FLYWAY_USER:postgres}
    password: ${FLYWAY_PASSWORD}
    locations: classpath:db/migration
    # A database that already holds the schema without Flyway history counts as V1.
    baseline-on-migrate: true
    baseline-version: 1

lms:
  jwt:
    secret: ${JWT_SECRET}
    issuer: lms
    access-token-ttl: 15m

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
